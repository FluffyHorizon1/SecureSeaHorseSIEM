name: Secret scan

# Defence in depth next to GitHub secret scanning / push protection (which must
# be enabled in repo settings): scans every push and PR with gitleaks using the
# project rules in .gitleaks.toml. The gitleaks binary is downloaded at a pinned
# version and verified against a pinned SHA-256 -- no third-party action runs
# with repo access.
#
# Known historical findings (the pre-Phase-28 shipped placeholder credentials,
# see docs/THREAT_MODEL.md and SECURITY audit notes) are recorded in
# .gitleaks-baseline.json so that only NEW leaks fail the build.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 4 * * 1"   # weekly full-history scan
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir --no-banner --redact=100 -c .gitleaks.toml .

      - name: Scan full git history (known findings baselined)
        run: >
          gitleaks git --no-banner --redact=100 -c .gitleaks.toml
          --baseline-path .gitleaks-baseline.json --log-opts="--all" .
