name: CI

# Phase 29: a fresh clone must build and the tests must pass. This job would
# have caught every headline issue from the 2026-09-18 review: the mangled
# filenames (nothing configures), the missing includes, and -- via the
# deserializer tests -- the ingest crash.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux:
    name: Linux (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libpq-dev

      - name: Configure (superbuild, server + client + tests)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Version consistency
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION file: $VER"
          ./build/server/SeaHorseServer --version | grep -q "v$VER" \
            || { echo "server --version does not match VERSION ($VER)"; exit 1; }
          grep -q "v$VER" server/src/dashboard_html.h \
            || { echo "dashboard_html.h version does not match VERSION ($VER)"; exit 1; }
          echo "version consistent across VERSION, banner, dashboard"

  windows:
    name: Windows (build via vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL + libpq (vcpkg)
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows libpq:x64-windows

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
