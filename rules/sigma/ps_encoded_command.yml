title: Encoded PowerShell command line
id: 8f3c1a10-0c6b-4b2e-9d11-51e0a8c00001
status: experimental
level: high
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cmd:
    CommandLine|contains:
      - '-enc'
      - '-EncodedCommand'
      - '-e '
  condition: selection_img and selection_cmd
