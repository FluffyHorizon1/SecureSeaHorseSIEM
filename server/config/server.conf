# =============================================================================
# SecureSeaHorse Server Configuration -- v5.1.0
# =============================================================================
# Every key in the ACTIVE sections below is read by the server. Keys for
# features that are not yet wired into the build live under the clearly-marked
# "PLANNED / NOT YET WIRED" section at the very bottom so this file never
# implies a capability the binary does not have.

# --- Network ---
port = 65432

# --- mTLS Certificates ---
ca_path     = certs/ca.crt
server_crt  = certs/server.crt
server_key  = certs/server.key

# --- Logging ---
log_file      = server.log
log_max_bytes = 10485760
log_max_files = 5

# --- Legacy Storage (CSV) ---
csv_output = s_log.csv

# --- [Phase 1] Dynamic Thread Pool ---
pool_min            = 2
pool_max            = 32
pool_idle_timeout_s = 30

# =============================================================================
# PHASE 2: Data Intelligence
# =============================================================================

# --- PostgreSQL Persistence ---
db_enabled  = true
db_host     = 127.0.0.1
db_port     = 5432
db_name     = seahorse
db_user     = seahorse
db_pass     =

# --- Regex Engine ---
rules_file  = rules.conf

# --- Threshold Alerting ---
alert_enabled = true
alert_log     = alerts.log
# alert_threshold_auth_failure = 5,300,600

# =============================================================================
# PHASE 3: Security & Lifecycle
# =============================================================================

hmac_enabled         = true
connection_timeout_s = 120
crl_path             =
ocsp_stapling        = false

# =============================================================================
# PHASE 4: Traffic Classification & Exploit Detection
# =============================================================================

# --- Master Switch ---
classifier_enabled = true

# --- Baseline Learning ---
# Alpha: EWMA learning rate (0.01=slow, 0.1=fast). Lower = more stable baseline.
cls_baseline_alpha  = 0.05
# Warmup: minimum samples before baselines are trusted (avoids cold-start false positives)
cls_baseline_warmup = 20

# --- Z-Score Anomaly Thresholds ---
# How many standard deviations from baseline = anomaly
cls_z_high   = 3.0    # Critical threshold
cls_z_medium = 2.5    # High threshold
cls_z_low    = 2.0    # Medium threshold (informational)

# --- DDoS Detection ---
cls_ddos_inbound_z         = 3.0         # Z-score for inbound traffic spike
cls_ddos_inbound_abs_bytes = 100000000   # Absolute ceiling: 100MB/interval

# --- Port Scan Detection ---
cls_portscan_refused_min = 10   # Min "connection refused" entries to flag

# --- Brute Force Detection ---
cls_brute_min_failures = 5      # Min auth failures per interval

# --- Data Exfiltration Detection ---
cls_exfil_outbound_z         = 3.0       # Z-score for outbound spike
cls_exfil_outbound_abs_bytes = 50000000  # Absolute ceiling: 50MB/interval

# --- C2 Beaconing Detection ---
# Coefficient of variation threshold for report intervals.
# Lower = more regular intervals = more suspicious.
cls_c2_jitter_max = 0.15

# =============================================================================
# PHASE 5: Threat Intelligence Feeds
# =============================================================================

# --- Master Switch ---
threat_intel_enabled = true

# --- Feed Directory ---
# Path to directory containing .csv feed files.
# All .csv files in this directory are loaded automatically.
feeds_dir = feeds

# --- Auto-Reload ---
# How often (seconds) to check feed files for modifications.
# Set to 0 to disable auto-reload (manual reload only).
feeds_reload_interval_s = 300

# =============================================================================
# PHASE 6: File Integrity Monitoring (Server-Side)
# =============================================================================

# --- Master Switch ---
fim_enabled = true

# --- Severity Classification ---
# Default severity for file changes not matching critical/high path patterns.
fim_default_severity = medium

# --- Custom Critical Paths (comma-separated regex patterns) ---
# Changes to files matching these patterns are always "critical".
# Built-in critical paths (always active): /etc/passwd, /etc/shadow, /boot, etc.
# fim_critical_paths = /opt/myapp/config,/home/admin/.ssh

# --- Custom High Paths (comma-separated regex patterns) ---
# Changes to files matching these patterns are always "high".
# Built-in high paths (always active): /var/www, /etc/nginx, etc.
# fim_high_paths = /opt/myapp/data,/srv/

# =============================================================================
# PHASE 7: REST API & Web Dashboard
# =============================================================================

# --- Master Switch ---
rest_enabled = true

# --- HTTP Port ---
rest_port = 8080

# --- Bind Address ---
# 0.0.0.0 = all interfaces, 127.0.0.1 = localhost only.
# Default is loopback. The server REFUSES to start the API on a non-loopback
# address unless rest_api_token is set to a strong non-default value (Phase 28).
rest_bind = 127.0.0.1

# --- API Token ---
# Bearer token for API authentication. Leave EMPTY only while bound to loopback.
# To expose the API off-box, bind to a routable address AND set a strong random
# token here (a value containing "changeme" is rejected as a default).
rest_api_token =

# --- CORS ---
# Access-Control-Allow-Origin for the API. Empty = no CORS header (same-origin
# only; the built-in dashboard is same-origin and needs nothing here). Set to a
# specific dashboard origin (e.g. https://siem.example.com) if serving the UI
# from a different origin. Never use "*" with an auth token.
rest_cors_origin =

# =============================================================================
# PHASE 8: Incident Response Automation
# =============================================================================
ir_enabled = true
# ir_webhook_url = https://hooks.slack.com/services/YOUR/WEBHOOK/URL
# ir_script_dir = scripts

# =============================================================================
# PHASE 9: Agent Fleet Management
# =============================================================================
fleet_enabled = true
fleet_stale_s = 300
fleet_offline_s = 900

# =============================================================================
# PHASE 10: Network Deep Inspection
# =============================================================================
inspector_enabled = true
inspect_dns = true
inspect_protocol = true
inspect_connections = true
inspect_entropy = true

# =============================================================================
# PHASE 15: Correlation Engine
# =============================================================================
correlation_enabled = true

# =============================================================================
# PHASE 16: Sigma Rule Engine   [PLANNED -- NOT WIRED in v5.1]
# Engine exists but needs YAML-parser hardening (folded scalars + keyword
# selections) before the shipped rules load. See ROADMAP_v5.1 Phase 32.
# =============================================================================
# Community Sigma YAML detection rules. Drop *.yml / *.yaml files into
# sigma_rules_dir; the loader enforces the same caps as the regex engine
# (10k rules, 64 KB / file, 4 KB / pattern).
sigma_enabled      = true
sigma_rules_dir    = sigma
sigma_auto_reload  = true
sigma_reload_s     = 300

# =============================================================================
# PHASE 17: Agent Self-Protection & Auto-Update   [PLANNED -- NOT WIRED]
# =============================================================================
# Signed agent-update channel served over the existing mTLS connection.
# Leave updates_enabled=false on air-gapped installs.
updates_enabled    = false
updates_manifest   = updates/manifest.json
updates_rollout    = canary          # off | canary | percentage | all
updates_percentage = 10

# =============================================================================
# PHASE 18: Reporting & Compliance   [PLANNED -- NOT WIRED]
# =============================================================================
reports_enabled    = true
reports_output_dir = reports
# Built-in templates: pci-dss | hipaa | soc2 | exec-summary. Add one line
# per schedule: name | template | cron | lookback_days.
# reports_schedule = pci-q | pci-dss | 0 6 1 */3 * | 90

# =============================================================================
# PHASE 19: USB / Peripheral Monitor   [PLANNED -- NOT WIRED]
# =============================================================================
usb_enabled        = true
usb_whitelist_csv  = usb_whitelist.csv
# Correlation window (seconds): USB insert within this window of a successful
# interactive login escalates the alert to "high".
usb_login_window_s = 60

# =============================================================================
# PHASE 20/31: Multi-Tenancy & RBAC   [WIRED v5.1]
# Keys read: rbac_enabled, rbac_jwt_secret, rbac_token_ttl_s, rbac_users_db,
# rbac_tenants_db, rbac_audit_log, rbac_default_tenant. Bootstrap the first
# admin with:  SeaHorseServer --create-admin <email>
# (rbac_oidc_* are PLANNED -- not read yet.)
# =============================================================================
# Single-tenant on-prem: leave rbac_enabled = false and keep the legacy
# rest_api_token. Turn this on to enable JWT-based tenant isolation.
rbac_enabled       = false
rbac_jwt_secret    =                 # 32+ random bytes; rotate via API
rbac_token_ttl_s   = 28800           # 8h
# Optional OIDC issuer for SSO installs.
rbac_oidc_issuer   =
rbac_oidc_client   =

# =============================================================================
# PHASE 21: SOAR Integration   [PLANNED -- NOT WIRED]
# =============================================================================
# Stock vendors: generic | splunk_soar | cortex_xsoar | thehive.
soar_enabled       = false
soar_vendor        = generic
soar_url           =
soar_api_key       =
soar_verify_tls    = true

# =============================================================================
# PHASE 22: Syslog Ingestion & Forwarding   [PLANNED -- NOT WIRED]
# =============================================================================
syslog_listener_enabled = false
syslog_udp_port         = 514
syslog_tcp_tls_port     = 6514
syslog_tls_cert         = certs/syslog.crt
syslog_tls_key          = certs/syslog.key

syslog_forwarder_enabled = false
syslog_upstream_host     =
syslog_upstream_port     = 6514
syslog_output_format     = cef       # cef | leef | rfc5424

# =============================================================================
# PHASE 23/33: Threat Hunting Query Language   [WIRED v5.1]
# POST /api/hunt is live (analyst+ under RBAC). The hunt_* tuning keys below
# are PLANNED -- the endpoint currently uses built-in caps, not these values.
# =============================================================================
hunt_enabled           = true
hunt_statement_timeout_ms = 30000
hunt_row_cap           = 10000

# =============================================================================
# PHASE 24/34: ML Anomaly Detection   [WIRED v5.1]
# Keys read: ml_enabled, ml_window_size, ml_warmup_samples,
# ml_retrain_interval_s, ml_alert_score_min, ml_isoforest_trees,
# ml_isoforest_subsample. (ml_isoforest_refit_every, ml_beacon_scan_s: PLANNED.)
# =============================================================================
ml_enabled             = true
ml_isoforest_trees     = 100
ml_isoforest_subsample = 256
ml_isoforest_refit_every = 500
ml_alert_score_min     = 0.75
ml_beacon_scan_s       = 300

# =============================================================================
# PHASE 25: WebSocket Live Stream   [PLANNED -- NOT WIRED]
# =============================================================================
# WebSocket server is co-hosted on the REST port (Phase 7). Disable only if
# you don't plan to use the React dashboard or external subscribers.
ws_enabled             = true
ws_backpressure_queue  = 512
ws_max_clients         = 500
