title: Credential Dumping via LSASS / mimikatz
id: 2b6db4b8-3c3c-47d3-95e1-1c21d47b8a04
status: stable
description: Well-known credential-access strings. Overlaps with the Phase 11
  suspicious-process library, but catches cases where the binary was renamed
  yet the characteristic in-memory strings survived.
level: critical
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    - "sekurlsa::logonpasswords"
    - "sekurlsa::minidump"
    - "privilege::debug"
    - "lsass.dmp"
    - "procdump.exe -ma lsass"
    - "rundll32.exe comsvcs.dll, MiniDump"
  condition: selection
tags:
  - attack.t1003.001
  - attack.credential_access
falsepositives:
  - Authorized DFIR tooling during an investigation
